name: browser

on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'stories/**'
      - '.storybook/**'
      - 'test/browser/**'
      - 'pnpm-lock.yaml'
      - 'vitest.config.ts'
      - '.github/workflows/browser.yml'
  pull_request:
    paths:
      - 'src/**'
      - 'stories/**'
      - '.storybook/**'
      - 'test/browser/**'
      - 'pnpm-lock.yaml'
      - 'vitest.config.ts'
      - '.github/workflows/browser.yml'

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: true

jobs:
  browser:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      id-token: write
    container:
      image: mcr.microsoft.com/playwright:v1.64.1-noble@sha256:47b510dd9230bf0b9bfc9b20102241e577ea7a99334ab4c3ca19f19770e9b8ea
      options: --user 1001 --ipc=host
    steps:
      - name: Check out the repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - name: Set up pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
      - name: Set up Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - name: Install the dependencies
        id: install
        run: pnpm install --frozen-lockfile
      - name: Run the stories and send their shots to Argos
        env:
          ARGOS_UPLOAD: ${{ !github.event.repository.fork }}
        run: pnpm run storybook:test
      - name: Run the browser tests
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: pnpm run test:browser
      - name: Keep the shots of failed tests
        if: ${{ failure() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: failed-test-shots
          path: .vitest/attachments/
          if-no-files-found: ignore
